<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  .repma-theme, :root {
    --color-accent: #8E1B3B;
    --color-accent-hover: color-mix(in oklab, var(--color-accent) 85%, white);
    --color-accent-active: color-mix(in oklab, var(--color-accent) 80%, black);
    --color-accent-bright: color-mix(in oklab, var(--color-accent) 55%, white);
    --color-accent-soft: color-mix(in oklab, var(--color-accent) 22%, transparent);
    --on-accent: #FFFFFF;
    --canvas: #121212; --surface: #1E1E1E; --surface-hover: #252525; --surface-raised: #2C2C2E;
    --border: #2C2C2E; --border-strong: #3A3A3C;
    --text: #FFFFFF; --text-secondary: #98989D; --text-disabled: #5A5A5E;
    --alert: #FF453A; --alert-soft: #3A1C1C; --live: #32D74B; --live-soft: #16301C;
    --warning: #FFD60A; --warning-soft: #332B0A; --info: #64D2FF; --info-soft: #0E2A36;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  }
</style>
<style>
@keyframes pickerPulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
</style>
</helmet>
<div style="position:fixed; inset:0; z-index:72; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:{{ outerPad }}; font-family:'Inter', system-ui, sans-serif; color:var(--text)">
  <div role="dialog" aria-modal="true" aria-label="{{ title }}" style="width:{{ panelW }}; height:{{ panelH }}; max-height:{{ panelMaxH }}; background:var(--surface); border-radius:{{ panelRadius }}; display:flex; flex-direction:column; overflow:hidden; ">

    <div style="flex:none; display:flex; align-items:center; gap:12px; padding:16px 16px 16px 24px; border-bottom:1px solid var(--border)">
      <div style="display:flex; align-items:center; gap:8px; height:44px; padding:0 12px; border:1px solid var(--border-strong); border-radius:8px; flex:1; min-width:0">
        <span style="font-family:'Material Symbols Rounded'; font-size:18px; line-height:1; color:var(--text-secondary)">search</span>
        <input type="text" placeholder="Search products…" value="{{ q }}" onChange="{{ onSearch }}" aria-label="Search products" style="flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:14px; color:var(--text)" />
      </div>
      <span style="font:500 14px 'Inter', system-ui, sans-serif; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ title }}</span>
      <button type="button" onClick="{{ onClose }}" aria-label="Close" style="width:44px; height:44px; flex:none; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; border-radius:8px; cursor:pointer" style-hover="color:var(--color-accent-bright)">
        <span style="font-family:'Material Symbols Rounded'; font-size:20px; line-height:1; color:var(--text)">close</span>
      </button>
    </div>

    <div style="flex:1; min-height:0; display:flex; flex-direction:{{ bodyDir }}">
      <div style="flex:none; display:flex; flex-direction:{{ railDir }}; gap:4px; padding:{{ railPad }}; width:{{ railW }}; background:var(--surface-raised); border-right:{{ railBorderR }}; border-bottom:{{ railBorderB }}; overflow:auto">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{ c.onClick }}" style="flex:none; text-align:left; min-height:40px; padding:8px 12px; border:none; border-radius:8px; background:{{ c.bg }}; color:{{ c.fg }}; font:500 14px 'Inter', system-ui, sans-serif; cursor:pointer; white-space:nowrap" style-hover="background:var(--surface); color:var(--color-accent-bright)">{{ c.name }}</button>
        </sc-for>
      </div>

      <div style="flex:1; min-width:0; overflow-y:auto; padding:16px">
        <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:12px">
            <sc-for list="{{ sk }}" as="n" hint-placeholder-count="8">
              <div style="border-radius:16px; padding:12px">
                <div style="height:96px; background:var(--surface-raised); border-radius:8px; animation:pickerPulse 1.4s ease-in-out infinite"></div>
                <div style="height:12px; margin-top:12px; background:var(--surface-raised); border-radius:8px; animation:pickerPulse 1.4s ease-in-out infinite"></div>
                <div style="height:10px; width:60%; margin-top:8px; background:var(--surface-raised); border-radius:8px; animation:pickerPulse 1.4s ease-in-out infinite"></div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isEmpty }}">
          <div style="padding:48px 24px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center">
            <span style="font-family:'Material Symbols Rounded'; font-size:32px; line-height:1; color:var(--text-secondary)">search</span>
            <div style="font-size:14px; color:var(--text-secondary)">No results for these filters.</div>
            <button type="button" onClick="{{ onClearFilters }}" style="height:44px; padding:11px 19px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--text); font:500 14px 'Inter', system-ui, sans-serif; cursor:pointer" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">Clear filters</button>
          </div>
        </sc-if>

        <sc-if value="{{ isData }}">
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:12px">
            <sc-for list="{{ items }}" as="p" hint-placeholder-count="8">
              <button type="button" onClick="{{ p.onClick }}" aria-pressed="{{ p.selected }}" style="text-align:left; border:{{ p.border }}; border-radius:8px; padding:{{ p.pad }}; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:8px" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">
                <div style="height:96px; border-radius:8px; background:var(--surface-raised); display:flex; align-items:center; justify-content:center">
                  <span style="font:600 18px 'Inter', system-ui, sans-serif; color:var(--text-secondary)">{{ p.initials }}</span>
                </div>
                <span style="font:500 14px 'Inter', system-ui, sans-serif; color:var(--text)">{{ p.name }}</span>
                <span style="font-size:12px; color:var(--text-secondary)">{{ p.sizeLabel }}</span>
              </button>
            </sc-for>
          </div>
          <sc-if value="{{ hasMore }}">
            <div style="display:flex; justify-content:center; padding-top:16px">
              <button type="button" onClick="{{ onMore }}" style="height:44px; padding:11px 19px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--text); font:500 14px 'Inter', system-ui, sans-serif; cursor:pointer" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">Load more</button>
            </div>
          </sc-if>
        </sc-if>
      </div>
    </div>

    <sc-if value="{{ hasSelection }}">
      <div style="flex:none; border-top:1px solid var(--border); padding:16px 24px 24px; background:var(--surface); max-height:52%; overflow-y:auto">
        <div style="display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap">
          <div style="width:48px; height:48px; flex:none; border-radius:8px; border:1px solid var(--border); background:var(--surface-raised); display:flex; align-items:center; justify-content:center">
            <span style="font:600 14px 'Inter', system-ui, sans-serif; color:var(--text-secondary)">{{ selInitials }}</span>
          </div>
          <div style="flex:1; min-width:200px">
            <div style="font:500 14px 'Inter', system-ui, sans-serif">{{ selName }}</div>
            <div style="margin-top:12px; min-height:96px">
              <dc-import name="SizeRun" label="Sizes" tiles="{{ tiles }}" hint-size="100%,96px"></dc-import>
            </div>
            <sc-if value="{{ hasDisabled }}">
              <div style="font-size:12px; color:var(--text-secondary); margin-top:8px">Dimmed sizes: {{ disabledCaption }}</div>
            </sc-if>
            <sc-if value="{{ noSizes }}">
              <div style="font-size:12px; color:var(--text-secondary); margin-top:8px">{{ noSizesMsg }}</div>
            </sc-if>
            <sc-if value="{{ errSize }}">
              <div style="font-size:12px; color:var(--alert); margin-top:8px">{{ errSizeMsg }}</div>
            </sc-if>
            <sc-if value="{{ selSku }}">
              <div style="font-size:12px; color:var(--text-secondary); margin-top:8px; font-family:'Inter', system-ui, sans-serif">{{ selSkuText }}</div>
            </sc-if>
          </div>
        </div>

        <sc-if value="{{ isList }}">
          <div style="display:flex; flex-direction:column; gap:4px; margin-top:16px; max-width:240px">
            <span style="font:500 14px 'Inter', system-ui, sans-serif">Requested quantity</span>
            <div style="display:flex; align-items:center; gap:8px">
              <button type="button" onClick="{{ onDec }}" aria-label="Decrease by one" style="width:44px; height:44px; flex:none; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; justify-content:center" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">
                <span style="font-family:'Material Symbols Rounded'; font-size:18px; line-height:1; color:var(--text)">remove</span>
              </button>
              <input type="text" value="{{ qty }}" onChange="{{ onQty }}" aria-label="Requested quantity" style="width:80px; height:44px; padding:12px; border:1px solid var(--border-strong); border-radius:8px; font-size:14px; text-align:center; font-variant-numeric:tabular-nums; font-family:var(--mono)" style-focus="border:2px solid var(--color-accent-bright); padding:11px" />
              <button type="button" onClick="{{ onInc }}" aria-label="Increase by one" style="width:44px; height:44px; flex:none; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; justify-content:center" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">
                <span style="font-family:'Material Symbols Rounded'; font-size:18px; line-height:1; color:var(--text)">add</span>
              </button>
            </div>
            <sc-if value="{{ errQty }}"><span style="font-size:12px; color:var(--alert)">{{ errQtyMsg }}</span></sc-if>
          </div>
        </sc-if>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px">
          <button type="button" onClick="{{ onClose }}" style="height:44px; padding:11px 19px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--text); font:500 14px 'Inter', system-ui, sans-serif; cursor:pointer" style-hover="border-color:var(--color-accent-bright); color:var(--color-accent-bright)">{{ closeLabel }}</button>
          <button type="button" onClick="{{ onConfirmClick }}" style="height:44px; padding:12px 20px; border:none; border-radius:8px; background:{{ ctaBg }}; color:#FFFFFF; font:500 14px 'Inter', system-ui, sans-serif; cursor:pointer" style-hover="background:var(--color-accent-hover)">{{ cta }}</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:640},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Add to assortment&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Add to assortment&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;assortment&quot;,&quot;list&quot;],&quot;default&quot;:&quot;assortment&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;data&quot;,&quot;loading&quot;],&quot;default&quot;:&quot;data&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;products&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{id:string;name:string;categoryId:string;initials:string;sizeLabel:string;sizes:Array&lt;{id:string;label:string;sku:string}&gt;}&gt;&quot;},&quot;categories&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{id:string;name:string}&gt;&quot;},&quot;disabled&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,boolean&gt;&quot;},&quot;disabledCaption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Already in the assortment&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onConfirm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:{sizeId:string;threshold:number;initial:number;qty:number})=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { q: '', cat: '', sel: null, sizeId: null, page: 1, threshold: '0', initial: '', qty: '1', err: {} };

  size() { return 12; }
  products() { return this.props.products || []; }
  filtered() {
    const q = (this.state.q || '').toLowerCase(), cat = this.state.cat;
    return this.products().filter(function (p) {
      if (cat && p.categoryId !== cat) return false;
      if (!q) return true;
      if (p.name.toLowerCase().indexOf(q) >= 0) return true;
      return (p.sizes || []).some(function (v) { return String(v.sku || '').toLowerCase().indexOf(q) >= 0; });
    });
  }
  selected() {
    const id = this.state.sel, all = this.products();
    return all.filter(function (p) { return p.id === id; })[0] || null;
  }
  reset(keepFilters) {
    this.setState(function (s) {
      return {
        sel: null, sizeId: null, threshold: '0', initial: '', qty: '1', err: {},
        q: keepFilters ? s.q : '', cat: keepFilters ? s.cat : '', page: keepFilters ? s.page : 1
      };
    });
  }
  confirm() {
    const s = this.state, mode = this.props.mode || 'assortment', err = {};
    if (!s.sizeId) err.size = 'Select a size';
    if (mode !== 'assortment') {
      if (!/^\d+$/.test(String(s.qty)) || parseInt(s.qty, 10) < 1) err.qty = 'Quantity must be a whole number of 1 or more';
    }
    if (Object.keys(err).length) { this.setState({ err: err }); return; }
    if (this.props.onConfirm) {
      this.props.onConfirm({
        sizeId: s.sizeId,
        threshold: s.threshold === '' ? 0 : parseInt(s.threshold, 10),
        initial: s.initial === '' ? 0 : parseInt(s.initial, 10),
        qty: parseInt(s.qty, 10) || 1
      });
    }
    if (mode === 'list') this.reset(true);
  }

  renderVals() {
    const self = this, s = this.state, p = this.props;
    const mode = p.mode || 'assortment';
    const compact = !!p.compact;
    const st = p.state || 'data';
    const disabled = p.disabled || {};
    const list = this.filtered();
    const shown = list.slice(0, s.page * this.size());
    const sel = this.selected();
    const selSizes = sel ? (sel.sizes || []) : [];
    const chosen = selSizes.filter(function (v) { return v.id === s.sizeId; })[0] || null;
    const cats = [{ id: '', name: 'All' }].concat(p.categories || []);

    return {
      title: p.title || 'Select a product',
      cta: p.cta || 'Add',
      ctaBg: 'var(--color-accent)',
      closeLabel: mode === 'list' ? 'Close' : 'Cancel',
      outerPad: compact ? '0px' : '24px',
      panelW: compact ? '100%' : 'min(960px, 100%)',
      // Fixed at its maximum — a full grid page, viewport-capped — so the modal never
      // resizes while open: the grid zone keeps its height and scrolls internally,
      // and the 720px budget already includes a selection panel with a WRAPPED run
      // of 44px tiles (product-picker.md §Stable height).
      panelH: compact ? '100%' : 'min(720px, calc(100vh - 48px))',
      panelMaxH: compact ? '100%' : 'calc(100vh - 48px)',
      panelRadius: compact ? '0px' : '10px',
      bodyDir: compact ? 'column' : 'row',
      railDir: compact ? 'row' : 'column',
      railW: compact ? '100%' : '200px',
      railPad: compact ? '8px' : '12px',
      railBorderR: compact ? 'none' : '1px solid var(--border)',
      railBorderB: compact ? '1px solid var(--border)' : 'none',
      q: s.q,
      onSearch: function (e) { self.setState({ q: e.target.value, page: 1 }); },
      onClose: function () { if (p.onClose) p.onClose(); },
      onClearFilters: function () { self.setState({ q: '', cat: '', page: 1 }); },
      cats: cats.map(function (c) {
        const on = c.id === s.cat;
        return { name: c.name, bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--text)' : 'var(--text-secondary)', onClick: function () { self.setState({ cat: c.id, page: 1 }); } };
      }),
      sk: [1, 2, 3, 4, 5, 6, 7, 8],
      isLoading: st === 'loading',
      isEmpty: st !== 'loading' && list.length === 0,
      isData: st !== 'loading' && list.length > 0,
      items: shown.map(function (it) {
        const on = it.id === s.sel;
        return {
          id: it.id, name: it.name, initials: it.initials, sizeLabel: it.sizeLabel,
          selected: on,
          border: on ? '2px solid var(--color-accent-bright)' : '1px solid var(--border)',
          pad: on ? '11px' : '12px',
          onClick: function () { self.setState({ sel: it.id, sizeId: null, err: {} }); }
        };
      }),
      hasMore: shown.length < list.length,
      onMore: function () { self.setState(function (x) { return { page: x.page + 1 }; }); },
      hasSelection: !!sel,
      selName: sel ? sel.name : '',
      selInitials: sel ? sel.initials : '',
      selSku: !!chosen,
      selSkuText: chosen ? chosen.sku : '',
      noSizes: !!sel && selSizes.length === 0,
      noSizesMsg: mode === 'assortment' ? 'No sizes available to add.' : 'No sizes available.',
      // Same primitive as the availability run (<SizeRun>): only the tones differ —
      // run-tile-selected / -disabled / -available. The picker never applies the
      // aging bands (DP-07): duration is not a selection criterion.
      tiles: selSizes.map(function (v) {
        const off = !!disabled[v.id];
        const on = v.id === s.sizeId;
        return {
          key: v.id,
          label: v.label,
          kind: 'toggle',
          disabled: off,
          pressed: on,
          tip: off ? (p.disabledCaption || 'Not available') : v.sku,
          aria: v.label + (off ? ' — ' + (p.disabledCaption || 'not available') : ''),
          border: on ? '2px solid var(--color-accent-bright)' : 'none',
          bg: on ? 'var(--surface)' : 'var(--surface-raised)',
          fg: off ? 'var(--text-secondary)' : (on ? 'var(--color-accent-bright)' : 'var(--text)'),
          weight: on ? 600 : 500,
          onClick: off ? function () { } : function () { self.setState({ sizeId: v.id, err: {} }); }
        };
      }),
      hasDisabled: selSizes.some(function (v) { return !!disabled[v.id]; }),
      disabledCaption: p.disabledCaption || '',
      isAssortment: false,
      isList: mode === 'list',
      threshold: s.threshold,
      initial: s.initial,
      qty: s.qty,
      onThreshold: function (e) { self.setState({ threshold: e.target.value, err: {} }); },
      onInitial: function (e) { self.setState({ initial: e.target.value, err: {} }); },
      onQty: function (e) { self.setState({ qty: e.target.value, err: {} }); },
      onDec: function () { self.setState(function (x) { return { qty: String(Math.max(1, (parseInt(x.qty, 10) || 1) - 1)), err: {} }; }); },
      onInc: function () { self.setState(function (x) { return { qty: String((parseInt(x.qty, 10) || 0) + 1), err: {} }; }); },
      errSize: !!s.err.size, errSizeMsg: s.err.size || '',
      errThr: !!s.err.thr, errThrMsg: s.err.thr || '',
      errInit: !!s.err.init, errInitMsg: s.err.init || '',
      errQty: !!s.err.qty, errQtyMsg: s.err.qty || '',
      onConfirmClick: function () { self.confirm(); }
    };
  }
}
</script>
</body>
</html>
